apiVersion: batch/v1
kind: CronJob
metadata:
  name: transformed-efd-prod-failure-monitor
spec:
  schedule: "*/60 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: processor  
            env:
            - name: INSTRUMENT
              value: "LATISS"
            - name: CONFIG_FILE
              value: "/opt/lsst/software/stack/python/lsst/consdb/transformed_efd/config/config_latiss.yaml"
            - name: FAILURE_MONITOR
              value: "--failure-monitor --monitor-window-days 7"
            - name: CONSDB_URL
              valueFrom:
                secretKeyRef:
                  name: efd-transform-secrets
                  key: consdb-url
            - name: CONSDB_INT_URL
              valueFrom:
                secretKeyRef:
                  name: efd-transform-secrets
                  key: consdb-int-url
            - name: BUTLER_REPO
              value: "s3://embargo@rubin-summit-users/butler.yaml"
